name: Deploy DevOps360 Infrastructure

on:
  workflow_dispatch:

# Possible for auto-sync infrastucture to main branch
#on:
#  push:
#    branches: 
#      - main

jobs:
  terraform-apply:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform/envs/dev
        run: terraform init

      - name: Terraform plan
        working-directory: terraform/envs/dev
        run: terraform plan -detailed-exitcode -no-color -input=false -out=${{ github.workspace }}/tfplan 2>&1

      - name: Terraform apply
        working-directory: terraform/envs/dev
        run: terraform apply -input=false ${{ github.workspace }}/tfplan